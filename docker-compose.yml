version: '3.9'
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fullstack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: npm run start:api
    working_dir: /workspace
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fullstack
      JWT_SECRET: super-secret
      JWT_REFRESH_SECRET: another-secret
    ports:
      - '3333:3333'
    volumes:
      - ./:/workspace
      - api_node_modules:/workspace/node_modules
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    command: npm run start:web -- --host 0.0.0.0 --disable-host-check
    working_dir: /workspace
    environment:
      NODE_ENV: development
    ports:
      - '4200:4200'
    volumes:
      - ./:/workspace
      - web_node_modules:/workspace/node_modules
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - db

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
